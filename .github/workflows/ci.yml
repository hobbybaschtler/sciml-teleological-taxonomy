name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate schema
        run: python -m sciml_taxonomy validate
      - name: Replay case studies (Section 9.4, Table 7)
        run: python -m sciml_taxonomy replay
      - name: Reproduce structural analysis (Table 5)
        run: python -m sciml_taxonomy structural
      - name: Regression suite
        run: pytest -q
