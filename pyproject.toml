[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciml-teleological-taxonomy"
version = "1.0.0"
description = "Goal-oriented taxonomy, decision protocol and machine-readable schema for Scientific Machine Learning architecture selection"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Johann Wiens"},
    {name = "Christoph Reich", email = "christoph.reich@hs-furtwangen.de"},
]
keywords = ["scientific machine learning", "taxonomy", "architecture selection", "decision support"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/hs-furtwangen-idacus/sciml-teleological-taxonomy"

[project.scripts]
sciml-taxonomy = "sciml_taxonomy.cli:main"

[tool.setuptools]
packages = ["sciml_taxonomy"]
include-package-data = true

[tool.setuptools.package-data]
sciml_taxonomy = ["../taxonomy.yaml", "../cases/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
